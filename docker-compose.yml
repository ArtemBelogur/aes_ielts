services:
  essay-app:
    build: .
    container_name: aes_ielts
    ports:
      - "8000:8000"
    runtime: nvidia
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
